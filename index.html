<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>Deer Diary</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" href="./favicon.ico" type="image/x-icon">
	</head>
	<body>
		<!-- <img src="img/clouds.png" id="clouds"> -->
		<header>
			<ul>
				<li>
					<h1 id="pageTitle">Deer Diary</h1>
				</li>
				<li>
					<button onclick="entryFormShow()">New</button>
				</li>
				<li>
					<button onclick="saveDiary()">Save</button>
				</li>
				<li>
					<button onclick="loadDiary()">Load</button>
				</li>
				<li>
					<button onclick="confirmDiaryUnload()">End</button>
				</li>
			</ul>
		</header>
		
		<main>
			<ul id="time">
				<li>
					<button onclick="navOldest()"><<</button>
				</li>
				<li>
					<button onclick="navPrevious()"><</button>
				</li>
				<li>
					<p id="current"></p>
				</li>
				<li>
					<button onclick="navNext()">></button>
				</li>
				<li>
					<button onclick="navLatest()">>></button>
				</li>
			</ul>
			
			<section id="entryForm">
				<p>Title:</p>
				<input type="text" id="title">
				<p>Content:</p>
				<!-- <input type="text" id="content"> -->
				<textarea id="content">a</textarea>
				<p id="entryFormError">Please submit both filled text fields.</p>
				<button onclick="newEntry()">Add</button>
			</section>
			
			<section id="entries">

			</section>
			
			<img src="img/deer.png" id="deer">
		</main>
		<!-- <footer> -->
			<!-- <p>Made with <a href="https://en.wikipedia.org/wiki/Insanity">love</a> by <a href="https://github.com/localhostMei">localhostMei</a>.</p> -->
		<!-- </footer> -->
		<script src="script.js"></script>
	</body>
</html>
